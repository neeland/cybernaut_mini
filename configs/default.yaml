# Quality profile: real sentence-transformers embeddings.
#
# This is an explicit opt-in, NOT the baseline. It requires the optional 'st' extra
# and downloads the model on first use:
#
#     uv sync --extra st          # or: make install-prod
#     cybernaut-mini build --input ... --index ... --config configs/default.yaml
#
# Without --config, the offline hash embedder is used (see conf/base/parameters.yml),
# so the project runs on a bare install. For a fully offline profile with a smaller
# shard count, use configs/tiny.yaml.
seed: 42
embedding:
  provider: sentence_transformers
  model: intfloat/multilingual-e5-small
index:
  n_shards: 12
  max_keywords: 30
  max_entities: 30
  cooccurrence_window: 5
  min_edge_count: 2
rrf:
  k: 60
  dense_weight: 1.0
  lexical_weight: 1.0
  entity_weight: 0.5
agent:
  exploration_constant: 1.2
  max_expansions: 5
  max_retrieval_calls: 18
  judge: heuristic
  query_generator: heuristic
