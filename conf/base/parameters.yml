# Kedro-side defaults; mirror configs/default.yaml. The Typer CLI passes the chosen
# configs/*.yaml as extra_params, which override these at run time.
seed: 42
embedding:
  provider: sentence_transformers
  model: intfloat/multilingual-e5-small
  dim: 256
index:
  n_shards: 12
  max_keywords: 30
  max_entities: 30
  cooccurrence_window: 5
  min_edge_count: 2
rrf:
  k: 60
  dense_weight: 1.0
  lexical_weight: 1.0
  entity_weight: 0.5
agent:
  exploration_constant: 1.2
  max_expansions: 5
  max_retrieval_calls: 18
  judge: heuristic
  query_generator: heuristic
# Filled in by the CLI (or kedro run --params) per invocation.
input_path: data/sample/documents.jsonl
index_path: artifacts/sample
judgments_path: data/sample/judgments.jsonl
offline: false
