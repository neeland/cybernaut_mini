# Production catalog overrides: `kedro run --env prod --pipeline production`.
#
# Replaces the NOSIBLE/prediction source with the two real-data sources:
#   CC-News spine   (stanford-oval/ccnews)      — ~192k English articles
#   MIRACL corpus   (miracl/miracl-corpus en)   — ~8k passages (all qrel positives)
# Together they form a ~200k-document, 256-shard index.
#
# Requires the `hf` extra:  uv sync --extra hf --extra st
# Neither dataset is gated: HF_TOKEN is not required.

# ------------------------------------------------------------------ #
# 01_raw — acquisition                                                #
# ------------------------------------------------------------------ #

raw_ccnews_source:
  type: cybernaut_mini.datasets.HuggingFaceDataset
  repo_id: stanford-oval/ccnews
  # SHA pinned 2026-08-14 from:
  #   uv run python -c "from huggingface_hub import HfApi; \
  #     print(HfApi().dataset_info('stanford-oval/ccnews').sha)"
  revision: d733e654c9a506df519e1a166a86c118c7657ce4
  split: train
  streaming: true
  # filter_equals is applied before islice so max_rows counts English rows only,
  # not the full multilingual stream. Critical for CC-News which is 100M+ rows
  # across ~90 languages.
  filter_equals:
    language: en
  # 193k rows ≈ 200k target minus the ~7,921 mandatory MIRACL passages, with
  # headroom for rows dropped by the min_text_chars filter in normalize_rows.
  # runtime_params allows --params max_rows=N to override for calibration runs.
  max_rows: ${runtime_params:max_rows,193000}

raw_ccnews:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/01_raw/ccnews_miracl_ccnews_snapshot.jsonl

raw_miracl_source:
  type: cybernaut_mini.datasets.HfFileDataset
  repo_id: miracl/miracl-corpus
  # SHA pinned 2026-08-14 from:
  #   uv run python -c "from huggingface_hub import HfApi; \
  #     print(HfApi().dataset_info('miracl/miracl-corpus').sha)"
  revision: d921ec7e349ce0d28daf30b2da9da5ee698bef0d
  # English passages only, filtered at stream time to the qrel-referenced docids.
  # Without the filter the full en corpus (32.9M passages, ~25 GB) streams into
  # memory and the snapshot save dies — observed 2026-08-16. The docid file is
  # generated from the pinned miracl/miracl qrels (same revision family as
  # miracl_en_dev_source below):
  #   uv run python scripts/dump_miracl_docids.py
  # Filtering here does NOT violate the "snapshot stays complete" principle in
  # corpus_ingest/nodes.py: the qrel docid set is fixed by the pinned MIRACL
  # revision, not by build parameters, so the filtered snapshot never needs
  # re-fetching when the build is re-tuned.
  path_pattern: "miracl-corpus-v1.0-en/*.jsonl.gz"
  filter_column: docid
  filter_values_file: data/01_raw/miracl_en_dev_docids.txt
  # Completed shards replay from here on re-run, so a network fault at shard
  # 34/66 resumes at 34 instead of re-streaming ~20 minutes of prior shards.
  shard_cache_dir: data/01_raw/.miracl_shard_cache

raw_miracl:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/01_raw/ccnews_miracl_miracl_snapshot.jsonl

# ------------------------------------------------------------------ #
# 02_intermediate — normalised to the Document schema                 #
# ------------------------------------------------------------------ #

normalized_ccnews:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_ccnews_documents.jsonl

normalized_miracl:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_miracl_documents.jsonl

merged_documents:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_merged_documents.jsonl

# ------------------------------------------------------------------ #
# 03_primary — the build-ready corpus                                 #
# ------------------------------------------------------------------ #

documents:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: ${runtime_params:input_path,data/03_primary/ccnews_miracl_corpus.jsonl}

# ------------------------------------------------------------------ #
# The index                                                           #
# ------------------------------------------------------------------ #

shard_index:
  type: cybernaut_mini.datasets.ShardIndexDataset
  filepath: ${runtime_params:index_path,artifacts/ccnews-miracl-200k}

# ------------------------------------------------------------------ #
# index_build intermediate checkpoints                                #
# ------------------------------------------------------------------ #
# Every inter-node artifact is persisted so `kedro run --from-nodes=X`
# can restart mid-DAG after a crash.  Resume workflow (per stage):
#   ingest crash  → kedro run --env prod --pipeline index_build --from-nodes=embed_documents
#   embed crash   → re-run index_build (embed node auto-resumes via chunk cache in
#                    data/06_models/embed_cache/); or skip straight to sharding:
#                    kedro run --env prod --pipeline index_build --from-nodes=shard
#   shard crash   → kedro run --env prod --pipeline index_build --from-nodes=build_manifests
#   manifest crash→ kedro run --env prod --pipeline index_build --from-nodes=build_index_payload
#   eval crash    → kedro run --env prod --pipeline evaluation

raw_documents:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_raw_documents.jsonl

text_result:
  type: cybernaut_mini.datasets.CanonicalJsonDataset
  filepath: data/02_intermediate/ccnews_miracl_text_result.json

# vectors_list intentionally MemoryDataset (not persisted): the embed_with_cache
# chunk cache in data/06_models/embed_cache/ handles crash recovery — a resume
# re-runs the embed node, which loads all completed chunks from cache as fast
# reads, then re-shards from the assembled matrix. Skipping the JSONL checkpoint
# saves ~600 MB of the available disk budget.

shard_result:
  type: cybernaut_mini.datasets.CanonicalJsonDataset
  filepath: data/06_models/ccnews_miracl_shard_result.json

manifests_list:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_manifests_list.jsonl

# ------------------------------------------------------------------ #
# evaluation pipeline checkpoints                                     #
# ------------------------------------------------------------------ #

judgments_list:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/ccnews_miracl_judgments_list.jsonl

metrics_list:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/08_reporting/ccnews_miracl_metrics_list.jsonl

# ------------------------------------------------------------------ #
# MIRACL en-dev judgment pipeline (task #5 / M1.4)                   #
# ------------------------------------------------------------------ #
# Run standalone: kedro run --env prod --pipeline judgment_ingest
# Or as part of production (documents must exist first for validation).

miracl_en_dev_source:
  # load_dataset("miracl/miracl") is blocked by a deprecated loading script
  # (miracl.py). MiraclTsvDataset reads the underlying TSV files directly via
  # HfFileSystem and assembles them into the same structured row format.
  type: cybernaut_mini.datasets.MiraclTsvDataset
  repo_id: miracl/miracl
  # SHA pinned 2026-08-14 from:
  #   uv run python -c "from huggingface_hub import HfApi; \
  #     print(HfApi().dataset_info('miracl/miracl').sha)"
  revision: 5be20db9509754dadad47689368639fcec739c00
  language: en
  split: dev

# Intermediate: unvalidated judgments before the corpus cross-check.
miracl_judgments_unvalidated:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/02_intermediate/miracl_en_dev_judgments_unvalidated.jsonl

# Final validated judgments consumed by the evaluation pipeline.
judgments:
  type: cybernaut_mini.datasets.JsonlDataset
  filepath: data/03_primary/miracl_en_dev_judgments.jsonl
