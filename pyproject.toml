[project]
name = "cybernaut-mini"
version = "0.1.0"
description = "Local-first educational replica of NOSIBLE's Cybernaut sharded hybrid search and three-stage agentic retrieval"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "rank-bm25>=0.2.2",
    "kedro>=0.19.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
nlp = ["spacy>=3.7"]
viz = ["kedro-viz>=9.0"]
# Corpus acquisition from the Hugging Face Hub. Optional so the core package
# stays network-free: without it, only local corpora (data/01_raw/*.jsonl) load.
hf = ["datasets>=3.0", "huggingface-hub>=0.25"]

[project.scripts]
cybernaut-mini = "cybernaut_mini.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    # Notebook execution. The notebooks are executed by the test suite against the
    # real catalog, so a renamed dataset or changed node signature fails the build
    # instead of leaving a notebook that silently no longer runs.
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybernaut_mini"]

[tool.kedro]
package_name = "cybernaut_mini"
project_name = "cybernaut-mini"
kedro_init_version = "1.5.0"
source_dir = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cybernaut_mini"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25",
    "sklearn.*",
    "kedro.*",
    "sentence_transformers",
    "spacy",
    # Hugging Face `datasets`, only present with the optional `hf` extra.
    "datasets",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
